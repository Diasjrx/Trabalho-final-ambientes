name: Testes Backend (Cypress)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-backend:
    name: Cypress — Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências raiz (Cypress + ferramentas)
        run: npm install

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Iniciar backend em segundo plano
        working-directory: backend
        run: node index.js &
        env:
          PORT: 3001

      - name: Aguardar backend iniciar
        run: npx wait-on http://localhost:3001/health --timeout 60000

      - name: Executar testes Cypress do Backend
        run: npx cypress run --spec "cypress/e2e/backend.cy.js" --env apiUrl=http://localhost:3001

      - name: Upload de screenshots (em caso de falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-backend
          path: cypress/screenshots
          if-no-files-found: ignore
