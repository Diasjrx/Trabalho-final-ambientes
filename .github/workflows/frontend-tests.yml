name: Testes Frontend (Cypress)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-frontend:
    name: Cypress — Frontend E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências raiz (Cypress + ferramentas)
        run: npm install

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Iniciar backend em segundo plano
        working-directory: backend
        run: node index.js &
        env:
          PORT: 3001

      - name: Aguardar backend iniciar
        run: npx wait-on http://localhost:3001/health --timeout 60000

      - name: Servir frontend em segundo plano
        run: npx http-server frontend -p 3000 -c-1 --silent &

      - name: Aguardar frontend iniciar
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Executar testes Cypress do Frontend
        run: npx cypress run --spec "cypress/e2e/frontend.cy.js" --config "baseUrl=http://localhost:3000"
        env:
          CYPRESS_apiUrl: http://localhost:3001
          CYPRESS_frontendUrl: http://localhost:3000

      - name: Upload de screenshots (em caso de falha)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-frontend
          path: cypress/screenshots
          if-no-files-found: ignore
